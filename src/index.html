<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人狼 村vs村</title>
<!-- 背景画像を最優先でプリロード -->
<link rel="preload" as="image" href="./assets/BG/nontitleBG.webp">
<link rel="preload" as="image" href="./assets/resultBG/win.webp">
<link rel="preload" as="image" href="./assets/resultBG/loss.webp">
<link rel="preload" as="image" href="./assets/resultBG/draw.webp">
<link rel="stylesheet" href="./css/variables.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="stylesheet" href="./css/board.css">
<link rel="stylesheet" href="./css/ledger.css">
<link rel="stylesheet" href="./css/itemModal.css">
<link rel="stylesheet" href="./css/veil.css">
<link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

<div id="veil" class="veil"></div>

<div class="wrap">
<header>
  <h1>人狼　村vs村</h1>
  <div class="sub" id="modeline"></div>
  <div class="statusbar" id="status"></div>
</header>

<div class="grid">
  <div>
    <div class="stageflip" id="stageflip"></div>
    <div class="stage" id="stage">
      <div class="board" id="board-mine">
        <h2 id="t-mine">自分の村</h2>
        <div class="hint">神視点。全員の役職と、訪ねてきた探索者の位置が見える。</div>
        <div class="map" id="map-mine"></div>
      </div>
      <div class="board" id="board-foe">
        <h2 id="t-foe">相手の村</h2>
        <div class="hint">誰がどの家に住むかは見えるが、役職は分からない。</div>
        <div class="map" id="map-foe"></div>
      </div>
    </div>
    <div class="panel" id="panel"></div>

    <details>
      <summary>ルール要約</summary>
      <ul id="rules-list"></ul>
    </details>
  </div>
  <aside id="ledger-aside"><div class="ledger"><h3 id="ledger-title">覚え書き</h3><div id="ledger"></div></div></aside>
  <div id="ledger-scrim" onclick="closeLedger()"></div>
  <button id="ledger-tab" onclick="toggleLedger()" aria-label="覚え書き"></button>
</div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
