<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="white"/>

  <!-- 道 (edges) - 幅14px程度 -->
  <g stroke="black" stroke-width="14" fill="none" stroke-linecap="round">
    <!-- 外周（8本） -->
    <line x1="170" y1="150" x2="500" y2="150"/>
    <line x1="500" y1="150" x2="830" y2="150"/>
    <line x1="830" y1="150" x2="830" y2="460"/>
    <line x1="830" y1="460" x2="830" y2="770"/>
    <line x1="830" y1="770" x2="500" y2="770"/>
    <line x1="500" y1="770" x2="170" y2="770"/>
    <line x1="170" y1="770" x2="170" y2="460"/>
    <line x1="170" y1="460" x2="170" y2="150"/>
    <!-- 内部縦横（4本） -->
    <line x1="500" y1="150" x2="500" y2="460"/>
    <line x1="500" y1="460" x2="500" y2="770"/>
    <line x1="170" y1="460" x2="500" y2="460"/>
    <line x1="500" y1="460" x2="830" y2="460"/>
    <!-- 角から中央への斜め（4本） -->
    <line x1="170" y1="150" x2="500" y2="460"/>
    <line x1="830" y1="150" x2="500" y2="460"/>
    <line x1="170" y1="770" x2="500" y2="460"/>
    <line x1="830" y1="770" x2="500" y2="460"/>
    <!-- 辺同士の斜め（4本） -->
    <line x1="500" y1="150" x2="170" y2="460"/>
    <line x1="500" y1="150" x2="830" y2="460"/>
    <line x1="500" y1="770" x2="170" y2="460"/>
    <line x1="500" y1="770" x2="830" y2="460"/>
  </g>

  <!-- 家 (houses) - 80x112pxの縦長長方形（実際の比率に合わせる） -->
  <g fill="black">
    <!-- 上段 -->
    <rect x="130" y="94" width="80" height="112" rx="4"/>   <!-- 北西 -->
    <rect x="460" y="94" width="80" height="112" rx="4"/>   <!-- 北 -->
    <rect x="790" y="94" width="80" height="112" rx="4"/>   <!-- 北東 -->
    <!-- 中段 -->
    <rect x="130" y="404" width="80" height="112" rx="4"/>  <!-- 西 -->
    <rect x="460" y="404" width="80" height="112" rx="4"/>  <!-- 中央 -->
    <rect x="790" y="404" width="80" height="112" rx="4"/>  <!-- 東 -->
    <!-- 下段 -->
    <rect x="130" y="714" width="80" height="112" rx="4"/>  <!-- 南西 -->
    <rect x="460" y="714" width="80" height="112" rx="4"/>  <!-- 南 -->
    <rect x="790" y="714" width="80" height="112" rx="4"/>  <!-- 南東 -->
  </g>
</svg>
